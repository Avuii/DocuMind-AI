name: DocuMind CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local files
        run: |
          blocked="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$blocked" ]; then
            printf 'Tracked files match .gitignore:\n%s\n' "$blocked"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:demo

  document-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        env:
          DOCUMIND_HOST: documind.example.com
          DOCUMIND_DATABASE_PASSWORD: compose-validation-only
        run: docker compose -f compose.production.yml config --quiet
      - run: docker compose up --build --detach
      - name: Wait for the API
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:5000/health/ready
      - name: Exercise upload, extraction and review
        shell: pwsh
        run: ./tests/document-api.ps1 -IncludeOcr
      - name: Evaluate OCR by layout
        run: python3 tests/ocr-eval.py --report test-results/ocr.json
      - name: Store OCR metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-metrics
          path: test-results/ocr.json
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  registry-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/RegistryIntegration --configuration Release
