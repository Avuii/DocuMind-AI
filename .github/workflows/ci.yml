name: DocuMind CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local files
        run: |
          blocked="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$blocked" ]; then
            printf 'Tracked files match .gitignore:\n%s\n' "$blocked"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:demo

  document-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach
      - name: Wait for the API
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:5000/health
      - name: Exercise upload, extraction and review
        shell: pwsh
        run: ./tests/document-api.ps1 -IncludeOcr
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
