name: Deploy interactive demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend-pages.yml
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documind-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local files
        run: |
          blocked="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$blocked" ]; then
            printf 'Tracked files match .gitignore:\n%s\n' "$blocked"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist-demo

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
